<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administrar noticias | Cancha Central</title><link rel="stylesheet" href="css/styles.css"></head>
<body data-page="admin"><a class="skip-link" href="#contenido">Saltar al contenido</a><header class="site-header"></header><main id="contenido" class="container page-space"><div class="title-row"><div><p class="eyebrow">PANEL EDITORIAL</p><h1 class="page-title">Administrar noticias</h1><p class="lead">Crea y elimina noticias para administrar el contenido.</p></div><button id="open-news-form" class="button">+ Nueva noticia</button></div><div id="admin-message" class="success-message" hidden role="status"></div><div class="table-wrap"><table><thead><tr><th>Título</th><th>Categoría</th><th>Fecha</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="admin-table"></tbody></table></div><dialog id="news-dialog"><form id="news-form" method="dialog"><div class="dialog-heading"><h2>Nueva noticia</h2><button class="icon-button" value="cancel" aria-label="Cerrar">×</button></div><label>Título *<input name="title" required></label><label>Categoría *<select name="category" required><option value="Fútbol colombiano">Fútbol colombiano</option><option value="Internacional">Internacional</option><option value="Champions">Champions</option><option value="Opinión">Opinión</option></select></label><label>Descripción breve *<textarea name="description" required rows="3"></textarea></label><label>Contenido *<textarea name="content" required rows="5"></textarea></label><button class="button" type="submit" value="default">Crear noticia</button></form></dialog></main><footer class="site-footer"></footer><script src="js/app.js"></script></body></html>
