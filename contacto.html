<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contacto | Cancha Central</title><link rel="stylesheet" href="css/styles.css"></head>
<body data-page="contact"><a class="skip-link" href="#contenido">Saltar al contenido</a><header class="site-header"></header><main id="contenido" class="container page-space contact-layout"><section><p class="eyebrow">HABLEMOS DE FÚTBOL</p><h1 class="page-title">Contáctanos</h1><p class="lead">¿Tienes una noticia, sugerencia o propuesta?</p><div class="contact-data"><h2>Correo editorial</h2><a href="mailto:redaccion@canchacentral.co">redaccion@canchacentral.co</a><h2>Redes sociales</h2><p>Instagram · X · YouTube</p></div></section><section class="form-card"><h2>Envíanos un mensaje</h2><p class="form-help">Los campos con * son obligatorios.</p><form id="contact-form" novalidate><label>Nombre completo *<input name="name" required minlength="3"></label><small class="error" data-error="name"></small><label>Correo electrónico *<input name="email" type="email" required></label><small class="error" data-error="email"></small><label>Asunto *<input name="subject" required minlength="3"></label><small class="error" data-error="subject"></small><label>Mensaje *<textarea name="message" required minlength="10" rows="4"></textarea></label><small class="error" data-error="message"></small><button class="button" type="submit">Enviar mensaje</button><p id="form-success" class="success-message" hidden role="status">Mensaje enviado correctamente. Te responderemos pronto.</p></form></section></main><footer class="site-footer"></footer><script src="js/app.js"></script></body></html>
